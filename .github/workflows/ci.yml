name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # A fork's pull request never runs on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ycs-bench]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: dotnet build Ycs.sln -c Release

      - name: Format (whitespace)
        run: dotnet format whitespace Ycs.sln --verify-no-changes

      - name: Unit tests
        run: dotnet test tests/Ycs.Tests -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Unit tests, collected handles poisoned
        run: YCS_POISON=1 dotnet test tests/Ycs.Tests -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Unit tests, corpus and fuzz with two-entry leaves and one-slot first pages
        run: |
          export YCS_LEAF_CAPACITY=2 YCS_SLAB_FIRST=1
          dotnet test tests/Ycs.Tests -c Release --no-build --blame-hang --blame-hang-timeout 10m
          dotnet test tests/Ycs.Corpus -c Release --no-build --blame-hang --blame-hang-timeout 10m
          dotnet test tests/Ycs.Fuzz -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Unit tests, arenas with three-slot pages and copy on merge
        run: YCS_ARENA_PAGE=3 YCS_ARENA_COPY=1 dotnet test tests/Ycs.Tests -c Release --no-build --blame-hang --blame-hang-timeout 10m

      # The slow category runs in Release above; in Debug it takes too long for a runner (overflow checks, no inlining).
      - name: Unit tests (Debug, overflow checks on)
        run: dotnet test tests/Ycs.Tests -c Debug --filter "TestCategory!=Slow" --blame-hang --blame-hang-timeout 10m

      - name: Yjs corpus
        run: dotnet test tests/Ycs.Corpus -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Sync server
        run: dotnet test tests/Ycs.Server.Tests -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Sync client (the Blazor client's provider)
        run: dotnet test tests/Ycs.Client.Tests -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Sync server against y-websocket and SignalR clients
        run: |
          (cd interop/server && npm ci)
          (cd interop/signalr && npm ci)
          bash interop/server/smoke.sh
          bash interop/server/converge.sh
          bash interop/signalr/smoke.sh
          cmp interop/signalr/provider.mjs samples/Ycs.Server/demo/src/signalr-provider.mjs

      - name: Fuzz the decoders
        run: dotnet test tests/Ycs.Fuzz -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Differential and property tests against Yjs
        run: |
          (cd interop/properties && npm ci)
          dotnet test tests/Ycs.Properties -c Release --no-build --blame-hang --blame-hang-timeout 10m

      - name: Allocation and time budgets
        run: dotnet test tests/Ycs.Budgets -c Release --no-build --blame-hang --blame-hang-timeout 10m --logger "console;verbosity=detailed"

      - name: Pack
        run: dotnet pack src/Ycs -c Release --no-build -o out/pack

      - name: Native AOT sample
        run: |
          dotnet publish samples/Ycs.AotSample -c Release -o out/aot
          ./out/aot/Ycs.AotSample

      - name: Blazor client publishes without trim warnings
        run: dotnet publish samples/Ycs.Blazor -c Release -o out/blazor

      - name: Browser-wasm sample (no workload)
        run: |
          dotnet publish samples/Ycs.WasmSample -c Release -o out/wasm
          node out/wasm/wwwroot/main.mjs

      - name: Interop against real Yjs
        run: |
          (cd interop/js && npm ci)
          (cd interop/v14 && npm ci)
          bash interop/run.sh

      - name: Corpus round-trip into Yjs
        run: |
          (cd interop/corpus && npm ci)
          bash interop/corpus/roundtrip.sh

  browser:
    # A fork's pull request never runs on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ycs-bench]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Chromium
        run: |
          (cd interop/demo && npm ci)
          (cd interop/blazor && npm ci)
          (cd interop/demo && npx playwright-core install --with-deps --only-shell chromium)

      - name: Demo page in the browser (WebSocket, SignalR, mixed)
        run: bash interop/demo/check.sh

      - name: Blazor client and a y-websocket client in one room
        run: bash interop/blazor/run.sh
